[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calendard"
version = "0.1.0"
description = "Tray calendar: a month grid you can page through, and nothing else"
requires-python = ">=3.11"
dependencies = [
    "PyGObject>=3.42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
calendard = "calendard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyGObject-stubs deliberately is NOT a declared dependency: it must be
# installed with PYGOBJECT_STUB_CONFIG=Gtk3,Gdk3 set, or pip selects the GTK4
# stubs, which contain no Gtk.StatusIcon at all. See `make dev`.
[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
# gi ships no py.typed of its own; the stub package supplies the types and this
# warning only reports that the runtime module has no inline annotations.
reportMissingModuleSource = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"

[[tool.pyright.executionEnvironments]]
root = "src"
